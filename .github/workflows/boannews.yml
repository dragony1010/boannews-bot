name: boannews-bot

on:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 실행 (UTC 기준, 실제로는 몇 분 늦어질 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write             # seen.json을 저장소에 다시 커밋하기 위해 필요

concurrency:
  group: boannews-bot         # 실행이 겹치지 않게

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests feedparser

      - name: Run bot
        env:
          RUN_ONCE: "1"
          FORUM: "1"   # 포럼 채널이면 "1", 일반 채널이면 이 줄을 지우세요
          FEED_URL: "https://www.boannews.com/rss/allArticle.xml"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python boannews_bot.py

      - name: Save seen.json (중복 전송 방지 기록)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen.json" && git push)
